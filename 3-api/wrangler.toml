name = "llama-masters-api"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
send_metrics = false

# Addresses: llama-masters-api.<subdomain>.workers.dev and custom domains: the site (twice) and the API
# (DNS records and certificates are created by Cloudflare; esauflores.com and tonalli.earth are zones in this account).
workers_dev = true
routes = [
  { pattern = "llama-masters.esauflores.com", custom_domain = true },
  { pattern = "llama-masters-api.esauflores.com", custom_domain = true },
  { pattern = "atlas.tonalli.earth", custom_domain = true },
]

# The website (4-web, built first by `bun run deploy`). The Worker runs first on every request so it
# can send plain http to https, then hands non-API paths to these files (binding ASSETS). Unknown
# paths get index.html (one-page app).
[assets]
directory = "../4-web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# The bucket 2-process_data writes to; the API reads exports/ from it (no credentials in code).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "llama-masters-firms"
