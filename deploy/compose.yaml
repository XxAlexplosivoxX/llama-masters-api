# API behind Caddy (automatic HTTPS) on a single VPS. See deploy/README.md.
#   cp deploy/.env.example deploy/.env    # set DOMAIN and API_TOKEN
#   docker compose -f deploy/compose.yaml up -d --build
services:
  api:
    # --build tags the image with this name; on a small VPS, load one built elsewhere
    # (docker save | ssh docker load) and start with --no-build. See deploy/README.md.
    image: llama-masters-api:latest
    build:
      context: ..
    env_file: .env
    environment:
      ADDR: ":8080"
      DB_PATH: /data/llama.db
    volumes:
      # A host folder, so the database can be copied in and backed up with plain cp/scp.
      # It must be owned by the image's nonroot user: sudo chown 65532:65532 deploy/data
      - ./data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:  # TLS certificates; keep it so restarts do not request new ones
  caddy_config:
