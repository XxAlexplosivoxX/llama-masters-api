[tools]
go = "1.27.4"
node = "24"

[env]
# Local settings such as API_TOKEN; .env is git-ignored, see .env.example.
_.file = { path = ".env", redact = true }

[tasks.dev]
description = "Run the API with settings from .env"
run = "go run ./cmd/llama-api serve"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.vet]
description = "Static checks"
run = "go vet ./..."

[tasks.build]
description = "Build a static binary into bin/llama-api"
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -ldflags='-s -w' -o bin/llama-api ./cmd/llama-api"

[tasks."web:dev"]
description = "Run the website against this API (start `mise run dev` first)"
dir = "website"
run = "npm install && npm run dev"

[tasks."web:build"]
description = "Type-check and build the website into website/dist"
dir = "website"
run = "npm install && npm run build"

[tasks."web:data"]
description = "Rebuild the Brazil history and recent points from NASA FIRMS (no key needed)"
dir = "website"
run = "npm run data:brazil"

[tasks.push]
description = "Upload a prepared region: mise run push -- --dir PATH [--url URL] [--name NAME]"
run = "go run ./cmd/llama-api push"
